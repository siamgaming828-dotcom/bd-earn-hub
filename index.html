<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BD Earn Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef8f2;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    color:#222;
}

header{
    background:#087b18;
    color:white;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
    color:#087b18;
    margin-top:0;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    margin:7px 0 12px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#087b18;
}

textarea{
    min-height:100px;
}

button{
    border:0;
    background:#087b18;
    color:white;
    padding:12px 17px;
    border-radius:9px;
    font-weight:bold;
    font-size:15px;
    margin:4px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

button.gray{
    background:#666;
}

button.red{
    background:#d00000;
}

.hidden{
    display:none !important;
}

.msg{
    margin-top:12px;
    font-weight:bold;
}

.success{
    color:#087b18;
}

.error{
    color:#d00000;
}

.balance{
    font-size:32px;
    font-weight:bold;
    color:#087b18;
    margin:8px 0 15px;
}

.item{
    background:#f5f7f6;
    padding:15px;
    border-radius:10px;
    margin:10px 0;
    border-left:4px solid #087b18;
}

.status{
    font-weight:bold;
}

.small{
    color:#666;
    font-size:14px;
}

hr{
    border:0;
    border-top:1px solid #ddd;
    margin:18px 0;
}

.loading{
    color:#666;
    padding:10px 0;
}

.logo{
    font-size:25px;
}

@media(max-width:500px){
    .card{
        padding:16px;
    }

    header{
        font-size:21px;
    }
}
</style>
</head>

<body>

<header>
    🔐 BD Earn Hub
</header>

<div class="container">

<!-- ================= AUTH ================= -->

<div id="authBox" class="card">

    <h2 id="authTitle">📝 Registration</h2>

    <div id="registerFields">

        <input
            id="name"
            type="text"
            placeholder="আপনার নাম"
        >

        <input
            id="phone"
            type="tel"
            placeholder="মোবাইল নম্বর"
        >

    </div>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button
        id="mainAuthBtn"
        onclick="registerUser()"
    >
        📝 Register
    </button>

    <button
        class="gray"
        onclick="showLogin()"
    >
        Login
    </button>

    <button
        class="gray"
        onclick="showRegister()"
    >
        Register
    </button>

    <div
        id="authMsg"
        class="msg"
    ></div>

</div>


<!-- ================= USER APP ================= -->

<div
    id="userApp"
    class="hidden"
>

    <!-- ACCOUNT -->

    <div class="card">

        <h2>👤 My Account</h2>

        <p>
            নাম:
            <b id="userName">-</b>
        </p>

        <p>
            Email:
            <b id="userEmail">-</b>
        </p>

        <p>
            ফোন:
            <b id="userPhone">-</b>
        </p>

        <p>
            Account:
            <b id="userStatus">-</b>
        </p>

        <hr>

        <div>
            Balance
        </div>

        <div class="balance">
            ৳<span id="balance">0.00</span>
        </div>

        <button
            class="red"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <!-- ================= ACTIVATION ================= -->

    <div class="card">

        <h2>🔐 Account Activation</h2>

        <p>
            Activation Fee:
            <b>৳30</b>
        </p>

        <p class="small">
            bKash/Nagad-এ ৳30 পাঠিয়ে Transaction ID এখানে দিন।
        </p>

        <input
            id="trxId"
            type="text"
            placeholder="Transaction ID"
        >

        <button
            onclick="sendActivation()"
        >
            Submit Activation
        </button>

        <div
            id="activationMsg"
            class="msg"
        ></div>

    </div>


    <!-- ================= TASKS ================= -->

    <div class="card">

        <h2>📋 Available Tasks</h2>

        <div id="taskList">
            <div class="loading">
                Loading...
            </div>
        </div>

    </div>


    <!-- ================= SUBMISSIONS ================= -->

    <div class="card">

        <h2>📤 My Task Submissions</h2>

        <div id="mySubmissions">
            <div class="loading">
                Loading...
            </div>
        </div>

    </div>


    <!-- ================= WITHDRAW ================= -->

    <div class="card">

        <h2>💸 Withdraw</h2>

        <select id="withdrawMethod">

            <option value="bkash">
                bKash
            </option>

            <option value="nagad">
                Nagad
            </option>

            <option value="rocket">
                Rocket
            </option>

        </select>

        <input
            id="withdrawNumber"
            type="tel"
            placeholder="Account Number"
        >

        <input
            id="withdrawAmount"
            type="number"
            min="1"
            placeholder="Amount"
        >

        <button
            onclick="withdraw()"
        >
            💸 Withdraw Request
        </button>

        <div
            id="withdrawMsg"
            class="msg"
        ></div>

    </div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
   =====================================================

   এখানে নিজের Supabase Dashboard-এর তথ্য বসাও।

   SUPABASE_URL:
   Project Settings → API / Data API থেকে Project URL

   SUPABASE_ANON_KEY:
   API Keys → Publishable key

   ⚠️ Secret key এখানে কখনো দেবে না।
===================================================== */

const SUPABASE_URL =
"PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";

const SUPABASE_ANON_KEY =
"PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";


/* ================= SUPABASE ================= */

const sb =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let currentUser = null;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(id, text, type=""){

    const box =
        document.getElementById(id);

    box.textContent = text;

    box.className =
        "msg " + type;
}


/* =====================================================
   REGISTER MODE
===================================================== */

function showRegister(){

    document.getElementById(
        "authTitle"
    ).textContent =
        "📝 Registration";

    document.getElementById(
        "registerFields"
    ).classList.remove("hidden");

    const btn =
        document.getElementById(
            "mainAuthBtn"
        );

    btn.textContent =
        "📝 Register";

    btn.onclick =
        registerUser;

    showMessage(
        "authMsg",
        ""
    );
}


/* =====================================================
   LOGIN MODE
===================================================== */

function showLogin(){

    document.getElementById(
        "authTitle"
    ).textContent =
        "🔐 Login";

    document.getElementById(
        "registerFields"
    ).classList.add("hidden");

    const btn =
        document.getElementById(
            "mainAuthBtn"
        );

    btn.textContent =
        "🔐 Login";

    btn.onclick =
        loginUser;

    showMessage(
        "authMsg",
        ""
    );
}


/* =====================================================
   REGISTER
===================================================== */

async function registerUser(){

    const name =
        document.getElementById(
            "name"
        ).value.trim();

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(
        !name ||
        !phone ||
        !email ||
        !password
    ){

        showMessage(
            "authMsg",
            "সব তথ্য পূরণ করুন।",
            "error"
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "authMsg",
            "Password কমপক্ষে ৬ অক্ষরের হতে হবে।",
            "error"
        );

        return;
    }


    showMessage(
        "authMsg",
        "Registration হচ্ছে..."
    );


    try{

        /*
         * raw_user_meta_data-তে
         * name ও phone পাঠানো হচ্ছে।
         *
         * আপনার Supabase trigger যদি
         * auth.users থেকে public.users তৈরি করে,
         * তাহলে আলাদা করে users INSERT করার
         * প্রয়োজন নেই।
         */

        const result =
            await sb.auth.signUp({

                email:email,

                password:password,

                options:{
                    data:{
                        name:name,
                        phone:phone
                    }
                }

            });


        if(result.error){

            showMessage(
                "authMsg",
                result.error.message,
                "error"
            );

            return;
        }


        /*
         * Email confirmation চালু থাকলে
         * session পাওয়া যাবে না।
         */

        if(!result.data.session){

            showMessage(
                "authMsg",
                "✅ Registration হয়েছে। Email খুলে confirmation করুন, তারপর Login করুন।",
                "success"
            );

            document.getElementById(
                "password"
            ).value = "";

            return;
        }


        showMessage(
            "authMsg",
            "✅ Registration সফল হয়েছে।",
            "success"
        );


        await loadUser();

    }
    catch(error){

        showMessage(
            "authMsg",
            "Connection Error: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function loginUser(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(
        !email ||
        !password
    ){

        showMessage(
            "authMsg",
            "Email এবং Password দিন।",
            "error"
        );

        return;
    }


    showMessage(
        "authMsg",
        "Login হচ্ছে..."
    );


    try{

        const result =
            await sb.auth.signInWithPassword({

                email:email,

                password:password

            });


        if(result.error){

            showMessage(
                "authMsg",
                result.error.message,
                "error"
            );

            return;
        }


        await loadUser();

    }
    catch(error){

        showMessage(
            "authMsg",
            "Connection Error: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(){

    try{

        const sessionResult =
            await sb.auth.getSession();


        currentUser =
            sessionResult
            .data
            .session
            ?.user;


        if(!currentUser){

            return;
        }


        /*
         * public.users থেকে profile নেওয়া হচ্ছে।
         */

        const result =
            await sb
            .from("users")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


        if(result.error){

            showMessage(
                "authMsg",
                result.error.message,
                "error"
            );

            return;
        }


        /*
         * Trigger profile তৈরি করতে
         * একটু সময় নিলে আবার চেষ্টা।
         */

        if(!result.data){

            setTimeout(
                loadUser,
                1000
            );

            return;
        }


        const user =
            result.data;


        document
        .getElementById(
            "authBox"
        )
        .classList.add(
            "hidden"
        );


        document
        .getElementById(
            "userApp"
        )
        .classList.remove(
            "hidden"
        );


        document
        .getElementById(
            "userName"
        )
        .textContent =
            user.name || "";


        document
        .getElementById(
            "userEmail"
        )
        .textContent =
            user.email ||
            currentUser.email ||
            "";


        document
        .getElementById(
            "userPhone"
        )
        .textContent =
            user.phone || "";


        document
        .getElementById(
            "balance"
        )
        .textContent =
            Number(
                user.balance || 0
            ).toFixed(2);


        document
        .getElementById(
            "userStatus"
        )
        .textContent =
            user.active
            ? "🟢 Active"
            : "🔴 Inactive";


        loadTasks();

        loadSubmissions();

    }
    catch(error){

        console.error(error);

    }

}


/* =====================================================
   LOAD TASKS
===================================================== */

async function loadTasks(){

    const box =
        document.getElementById(
            "taskList"
        );


    box.innerHTML =
        '<div class="loading">Loading Tasks...</div>';


    const result =
        await sb
        .from("tasks")
        .select(
            "id,title,description,reward,category,is_open,created_at"
        )
        .eq(
            "is_open",
            true
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(result.error){

        box.innerHTML =
            '<p class="error">' +
            escapeHtml(
                result.error.message
            ) +
            '</p>';

        return;
    }


    if(
        !result.data ||
        result.data.length === 0
    ){

        box.innerHTML =
            "<p>এখন কোনো Task নেই।</p>";

        return;
    }


    box.innerHTML =
        result.data
        .map(
            task => {

                return `

                <div class="item">

                    <h3>
                        ${escapeHtml(
                            task.title
                        )}
                    </h3>

                    <p>
                        ${escapeHtml(
                            task.description || ""
                        )}
                    </p>

                    <p>
                        Category:
                        <b>
                            ${escapeHtml(
                                task.category || "General"
                            )}
                        </b>
                    </p>

                    <p>
                        Reward:
                        <b>
                            ৳${Number(
                                task.reward || 0
                            ).toFixed(2)}
                        </b>
                    </p>

                    <button
                        onclick="submitTask('${task.id}')"
                    >
                        📤 Submit Task
                    </button>

                </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   SUBMIT TASK
===================================================== */

async function submitTask(taskId){

    if(!currentUser){

        alert(
            "আগে Login করুন।"
        );

        return;
    }


    const proof =
        prompt(
            "Task-এর Proof/প্রমাণ লিখুন:"
        );


    if(proof === null){

        return;
    }


    if(!proof.trim()){

        alert(
            "Proof দিন।"
        );

        return;
    }


    const result =
        await sb
        .from("task_submissions")
        .insert({

            user_id:
                currentUser.id,

            task_id:
                taskId,

            proof:
                proof.trim(),

            status:
                "pending"

        });


    if(result.error){

        alert(
            result.error.message
        );

        return;
    }


    alert(
        "✅ Task Submission পাঠানো হয়েছে।"
    );


    loadSubmissions();

}


/* =====================================================
   LOAD SUBMISSIONS
===================================================== */

async function loadSubmissions(){

    const box =
        document.getElementById(
            "mySubmissions"
        );


    if(!currentUser){

        return;
    }


    const result =
        await sb
        .from("task_submissions")
        .select(
            "id,proof,status,created_at,task_id,tasks(title,reward)"
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(result.error){

        box.innerHTML =
            '<p class="error">' +
            escapeHtml(
                result.error.message
            ) +
            '</p>';

        return;
    }


    if(
        !result.data ||
        result.data.length === 0
    ){

        box.innerHTML =
            "<p>কোনো Submission নেই।</p>";

        return;
    }


    box.innerHTML =
        result.data
        .map(
            item => {

                const title =
                    item.tasks?.title ||
                    "Task";


                const reward =
                    Number(
                        item.tasks?.reward ||
                        0
                    ).toFixed(2);


                return `

                <div class="item">

                    <b>
                        ${escapeHtml(
                            title
                        )}
                    </b>

                    <br><br>

                    Reward:
                    ৳${reward}

                    <br>

                    Status:
                    <span class="status">
                        ${escapeHtml(
                            item.status || "pending"
                        )}
                    </span>

                </div>

                `;

            }
        )
        .join("");

}


/* =====================================================
   ACTIVATION REQUEST
===================================================== */

async function sendActivation(){

    if(!currentUser){

        return;
    }


    const trx =
        document
        .getElementById(
            "trxId"
        )
        .value
        .trim();


    if(!trx){

        showMessage(
            "activationMsg",
            "Transaction ID দিন।",
            "error"
        );

        return;
    }


    showMessage(
        "activationMsg",
        "Request পাঠানো হচ্ছে..."
    );


    const result =
        await sb
        .from("activation_requests")
        .insert({

            user_id:
                currentUser.id,

            trx_id:
                trx,

            amount:
                30,

            status:
                "pending"

        });


    if(result.error){

        showMessage(
            "activationMsg",
            result.error.message,
            "error"
        );

        return;
    }


    showMessage(
        "activationMsg",
        "✅ Activation Request পাঠানো হয়েছে।",
        "success"
    );


    document
    .getElementById(
        "trxId"
    )
    .value = "";

}


/* =====================================================
   WITHDRAW
===================================================== */

async function withdraw(){

    if(!currentUser){

        return;
    }


    const method =
        document
        .getElementById(
            "withdrawMethod"
        )
        .value;


    const number =
        document
        .getElementById(
            "withdrawNumber"
        )
        .value
        .trim();


    const amount =
        Number(
            document
            .getElementById(
                "withdrawAmount"
            )
            .value
        );


    if(
        !number ||
        !amount ||
        amount <= 0
    ){

        showMessage(
            "withdrawMsg",
            "সঠিক তথ্য দিন।",
            "error"
        );

        return;
    }


    const userResult =
        await sb
        .from("users")
        .select(
            "balance"
        )
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(userResult.error){

        showMessage(
            "withdrawMsg",
            userResult.error.message,
            "error"
        );

        return;
    }


    if(!userResult.data){

        showMessage(
            "withdrawMsg",
            "User profile পাওয়া যায়নি।",
            "error"
        );

        return;
    }


    const balance =
        Number(
            userResult.data.balance ||
            0
        );


    if(amount > balance){

        showMessage(
            "withdrawMsg",
            "আপনার balance যথেষ্ট নেই।",
            "error"
        );

        return;
    }


    const result =
        await sb
        .from("withdrawals")
        .insert({

            user_id:
                currentUser.id,

            method:
                method,

            account_number:
                number,

            amount:
                amount,

            status:
                "pending"

        });


    if(result.error){

        showMessage(
            "withdrawMsg",
            result.error.message,
            "error"
        );

        return;
    }


    showMessage(
        "withdrawMsg",
        "✅ Withdraw Request পাঠানো হয়েছে।",
        "success"
    );


    document
    .getElementById(
        "withdrawNumber"
    )
    .value = "";


    document
    .getElementById(
        "withdrawAmount"
    )
    .value = "";

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await sb.auth.signOut();

    currentUser = null;

    location.reload();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function(match){

            return {

                "&":
                    "&amp;",

                "<":
                    "&lt;",

                ">":
                    "&gt;",

                '"':
                    "&quot;",

                "'":
                    "&#039;"

            }[match];

        }
    );

}


/* =====================================================
   AUTH STATE
===================================================== */

sb.auth.onAuthStateChange(
    function(event, session){

        if(session){

            currentUser =
                session.user;

        }

    }
);


/* =====================================================
   START APP
===================================================== */

(async function(){

    try{

        const result =
            await sb.auth.getSession();


        if(
            result.data.session
        ){

            await loadUser();

        }

    }
    catch(error){

        console.error(error);

    }

})();

</script>

</body>
</html>
