<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD Earn Hub</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#eef7f1;
 color:#222;
 font-family:Arial,"Noto Sans Bengali",sans-serif
}
header{
 background:#087b18;
 color:white;
 text-align:center;
 padding:18px;
 font-size:24px;
 font-weight:bold
}
.container{
 width:100%;
 max-width:650px;
 margin:auto;
 padding:18px
}
.card{
 background:white;
 border-radius:16px;
 padding:20px;
 margin-bottom:18px;
 box-shadow:0 3px 15px rgba(0,0,0,.10)
}
.profile{text-align:center}
.avatar{
 width:90px;
 height:90px;
 border-radius:50%;
 background:#087b18;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:40px;
 font-weight:bold;
 margin:auto
}
h2{color:#087b18}
.balance{
 background:#087b18;
 color:white;
 border-radius:14px;
 padding:22px;
 text-align:center;
 margin-top:15px
}
.balance strong{
 display:block;
 font-size:38px;
 margin-top:8px
}
.status{
 display:inline-block;
 padding:8px 15px;
 border-radius:20px;
 margin-top:10px;
 font-weight:bold
}
.active{background:#d9f7df;color:#087b18}
.inactive{background:#ffdede;color:#d00000}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}
button{
 width:100%;
 border:0;
 border-radius:9px;
 padding:13px;
 margin-top:8px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer
}
.green{background:#087b18;color:white}
.red{background:#d90000;color:white}
.gray{background:#555;color:white}
.blue{background:#1976d2;color:white}

input,textarea{
 width:100%;
 padding:13px;
 border:1px solid #ccc;
 border-radius:9px;
 margin-top:8px;
 font-size:16px
}
.task{
 background:#f3f3f3;
 border-radius:10px;
 padding:14px;
 margin-top:10px
}
.hidden{display:none}
.small{font-size:13px;color:#666}
.notice{
 background:#fff3cd;
 padding:12px;
 border-radius:10px;
 margin-top:10px
}
</style>
</head>

<body>

<header>🔐 BD Earn Hub</header>

<div class="container">

<div class="card profile">
  <div class="avatar">M</div>
  <h2 id="userName">MD Siam</h2>
  <div id="userPhone">01865501991</div>
  <div id="statusBox" class="status active">🟢 Active</div>

  <div class="balance">
    Available Balance
    <strong id="balance">৳0.00</strong>
  </div>
</div>

<div class="card">
<h2>📋 Daily Tasks</h2>
<div id="taskList"></div>
</div>

<div class="card">
<h2>💸 Withdraw</h2>

<input id="withdrawAmount" type="number" placeholder="টাকার পরিমাণ">
<input id="withdrawNumber" placeholder="বিকাশ/নগদ নম্বর">

<button class="green" onclick="withdrawRequest()">
💸 Withdraw Request
</button>

<div id="withdrawMessage"></div>
</div>

<div class="card" id="activationCard">
<h2>🔐 Account Activation</h2>

<p>অ্যাকাউন্ট চালু করতে Transaction ID দিন।</p>

<input id="trxId" placeholder="Transaction ID">

<button class="green" onclick="submitTransaction()">
🧾 Transaction ID Submit
</button>

<div id="trxMessage"></div>
</div>

<div class="card">
<h2>🎁 Refer & Earn</h2>
<p>আপনার Referral Code:</p>

<input value="BD-EARN-001" readonly>

<button class="gray"
onclick="navigator.clipboard.writeText('BD-EARN-001')">
📋 Copy Code
</button>
</div>

<div class="card">
<button class="gray" onclick="location.href='admin.html'">
🔐 Admin Panel
</button>
</div>

</div>

<script>

const DEFAULT_DATA = {
 user:{
   name:"MD Siam",
   phone:"01865501991",
   active:true,
   balance:0,
   activationPending:false
 },
 tasks:[
   {
     id:1,
     title:"Facebook Page Follow",
     description:"নির্দেশনা অনুযায়ী কাজটি সম্পন্ন করুন।",
     reward:20,
     status:"open"
   },
   {
     id:2,
     title:"Website Visit",
     description:"ওয়েবসাইটটি ভিজিট করুন।",
     reward:10,
     status:"open"
   }
 ],
 submissions:[],
 withdrawals:[],
 transactions:[]
};

function getData(){
 let data=localStorage.getItem("bdEarnData");

 if(!data){
   localStorage.setItem("bdEarnData",JSON.stringify(DEFAULT_DATA));
   return DEFAULT_DATA;
 }

 return JSON.parse(data);
}

function saveData(data){
 localStorage.setItem("bdEarnData",JSON.stringify(data));
}

function money(n){
 return "৳"+Number(n).toFixed(2);
}

function render(){

 const data=getData();

 document.getElementById("userName").innerText=data.user.name;
 document.getElementById("userPhone").innerText=data.user.phone;
 document.getElementById("balance").innerText=money(data.user.balance);

 const status=document.getElementById("statusBox");

 if(data.user.active){
   status.className="status active";
   status.innerText="🟢 Active";
 }else{
   status.className="status inactive";
   status.innerText="🔴 Inactive";
 }

 const activation=document.getElementById("activationCard");

 if(data.user.active){
   activation.classList.add("hidden");
 }else{
   activation.classList.remove("hidden");
 }

 const list=document.getElementById("taskList");
 list.innerHTML="";

 const openTasks=data.tasks.filter(t=>t.status==="open");

 if(openTasks.length===0){
   list.innerHTML="<p>এই মুহূর্তে কোনো Task নেই।</p>";
   return;
 }

 openTasks.forEach(task=>{

   const submitted=data.submissions.some(
     s=>s.taskId===task.id && s.status==="pending"
   );

   const div=document.createElement("div");

   div.className="task";

   div.innerHTML=`
     <h3>${task.title}</h3>
     <p>${task.description}</p>
     <b>Reward: ${money(task.reward)}</b>

     ${
       submitted
       ?
       `<button class="gray" disabled>⏳ Submitted</button>`
       :
       `<button class="green"
          onclick="submitTask(${task.id})">
          📤 Submit Task
        </button>`
     }
   `;

   list.appendChild(div);
 });
}

function submitTask(id){

 const data=getData();

 const task=data.tasks.find(t=>t.id===id);

 if(!task)return;

 if(!data.user.active){
   alert("আপনার Account Active নয়।");
   return;
 }

 data.submissions.push({
   id:Date.now(),
   taskId:id,
   user:"MD Siam",
   status:"pending",
   reward:task.reward,
   submittedAt:new Date().toISOString()
 });

 saveData(data);

 alert("Task Submit হয়েছে। Admin Approve করলে Reward Balance-এ যোগ হবে।");

 render();
}

function withdrawRequest(){

 const data=getData();

 const amount=Number(
   document.getElementById("withdrawAmount").value
 );

 const number=
   document.getElementById("withdrawNumber").value.trim();

 if(!data.user.active){
   alert("Account Active নয়।");
   return;
 }

 if(!amount || amount<=0){
   alert("সঠিক Amount দিন।");
   return;
 }

 if(amount>data.user.balance){
   alert("আপনার Balance যথেষ্ট নয়।");
   return;
 }

 if(!number){
   alert("Payment Number দিন।");
   return;
 }

 data.withdrawals.push({
   id:Date.now(),
   amount:amount,
   number:number,
   status:"pending",
   createdAt:new Date().toISOString()
 });

 saveData(data);

 document.getElementById("withdrawMessage").innerHTML=
   '<div class="notice">✅ Withdraw Request পাঠানো হয়েছে।</div>';

 document.getElementById("withdrawAmount").value="";
 document.getElementById("withdrawNumber").value="";
}

function submitTransaction(){

 const data=getData();

 const trx=
   document.getElementById("trxId").value.trim();

 if(!trx){
   alert("Transaction ID দিন।");
   return;
 }

 data.transactions.push({
   id:Date.now(),
   trxId:trx,
   status:"pending",
   createdAt:new Date().toISOString()
 });

 data.user.activationPending=true;

 saveData(data);

 document.getElementById("trxMessage").innerHTML=
   '<div class="notice">✅ Transaction ID জমা হয়েছে। Admin Verify করার পর Account Active হবে।</div>';

 document.getElementById("trxId").value="";
}

render();

</script>

</body>
</html>
