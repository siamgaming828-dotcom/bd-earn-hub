<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Earn Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#eef8f2;
 font-family:Arial,"Noto Sans Bengali",sans-serif;color:#222
}
header{
 background:#087b18;color:#fff;text-align:center;
 padding:18px;font-size:25px;font-weight:bold
}
.wrap{max-width:680px;margin:auto;padding:15px}
.card{
 background:#fff;border-radius:16px;padding:18px;
 margin:14px 0;box-shadow:0 4px 18px #0001
}
h2{color:#087b18;margin-top:0}
input,textarea,select{
 width:100%;padding:12px;margin:6px 0 10px;
 border:1px solid #ccc;border-radius:9px;font-size:15px
}
textarea{min-height:90px}
button{
 width:100%;border:0;border-radius:10px;padding:13px;
 margin-top:8px;background:#087b18;color:white;
 font-size:16px;font-weight:bold
}
button.red{background:#d90000}
button.gray{background:#666}
button.orange{background:#ed9700}
.grid{
 display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.balance{
 background:#087b18;color:#fff;border-radius:14px;
 text-align:center;padding:22px;font-size:30px;font-weight:bold
}
.status{
 display:inline-block;padding:6px 10px;
 border-radius:20px;background:#ffdede
}
.item{
 background:#f5f5f5;padding:13px;
 border-radius:10px;margin:9px 0
}
.notice{
 background:#fff4c7;padding:12px;border-radius:10px
}
.small{font-size:13px;color:#666}
.hidden{display:none}
a{text-decoration:none}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{margin:0}
@media(max-width:500px){
 .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>💰 BD Earn Hub</header>

<div class="wrap">

<!-- ================= AUTH ================= -->

<div id="authBox" class="card">

<h2>👤 Account</h2>

<div class="tabs">
<button id="loginTab" onclick="showLogin()">Login</button>
<button class="gray" id="signupTab" onclick="showSignup()">Registration</button>
</div>

<div id="loginForm">

<input id="loginEmail"
type="email"
placeholder="ইমেইল">

<input id="loginPassword"
type="password"
placeholder="Password">

<button onclick="login()">
🔐 Login
</button>

</div>

<div id="signupForm" class="hidden">

<input id="regName"
placeholder="আপনার নাম">

<input id="regPhone"
placeholder="মোবাইল নম্বর">

<input id="regEmail"
type="email"
placeholder="ইমেইল">

<input id="regPassword"
type="password"
placeholder="Password">

<button onclick="signup()">
👤 Registration
</button>

</div>

<p id="authMsg" class="small"></p>

</div>


<!-- ================= USER APP ================= -->

<div id="app" class="hidden">

<div class="card">

<h2 id="welcome">👤 User</h2>

<div class="balance">
Balance<br>
৳<span id="balance">0.00</span>
</div>

<p>
Account:
<span id="accountStatus" class="status">
🔴 Inactive
</span>
</p>

</div>


<!-- ================= ACTIVATION ================= -->

<div id="activationBox" class="card">

<h2>🔐 Account Activation</h2>

<div class="notice">
<b>Nagad Send Money</b><br><br>
📱 <b>01865501991</b><br>
💰 Amount: <b>৳30</b>
</div>

<p>
উপরের নম্বরে Send Money করার পর Transaction ID দিন।
</p>

<input
id="activationTrx"
placeholder="Nagad Transaction ID">

<button onclick="sendActivation()">
✅ Submit Activation
</button>

<p id="activationMsg" class="small"></p>

</div>


<!-- ================= MAIN MENU ================= -->

<div id="mainMenu" class="hidden">

<div class="card">

<h2>📋 Services</h2>

<div class="grid">

<button onclick="dailyJobs()">
💼 Daily Job
</button>

<button onclick="servicePage('instagram')">
📷 Instagram Sell
</button>

<button onclick="servicePage('gmail')">
📧 Gmail Sell
</button>

<button onclick="telegramPage()">
📣 Join Telegram
</button>

<button onclick="withdrawPage()">
💸 Withdraw
</button>

<button class="gray" onclick="requestsPage()">
🧾 My Requests
</button>

</div>

</div>

<div id="content" class="card">

<h2>📌 Welcome</h2>

<p>
একটি অপশন নির্বাচন করুন।
</p>

</div>

</div>


<button class="red" onclick="logout()">
Logout
</button>

</div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
   ===================================================== */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let currentUser=null;
let profile=null;


/* =====================================================
   HELPERS
   ===================================================== */

function $(id){
 return document.getElementById(id);
}

function esc(value){
 return String(value ?? '').replace(
 /[&<>"']/g,
 m=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[m])
 );
}


/* =====================================================
   AUTH TABS
   ===================================================== */

function showLogin(){
 $("loginForm").classList.remove("hidden");
 $("signupForm").classList.add("hidden");
}

function showSignup(){
 $("loginForm").classList.add("hidden");
 $("signupForm").classList.remove("hidden");
}


/* =====================================================
   REGISTRATION
   ===================================================== */

async function signup(){

 const name=$("regName").value.trim();
 const phone=$("regPhone").value.trim();
 const email=$("regEmail").value.trim().toLowerCase();
 const password=$("regPassword").value;

 if(!name||!phone||!email||!password){
  $("authMsg").textContent=
  "সব তথ্য পূরণ করুন।";
  return;
 }

 if(password.length<6){
  $("authMsg").textContent=
  "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";
  return;
 }

 const auth=await db.auth.signUp({
  email:email,
  password:password,
  options:{
   data:{
    name:name,
    phone:phone
   }
  }
 });

 if(auth.error){
  $("authMsg").textContent=auth.error.message;
  return;
 }

 /*
   Email confirmation চালু থাকলে Supabase
   verification email পাঠাতে পারে।
 */

 if(auth.data.user){

  const userId=auth.data.user.id;

  const result=await db
  .from("users")
  .insert({
   id:userId,
   name:name,
   phone:phone,
   email:email,
   balance:0,
   active:false
  });

  if(result.error){
   $("authMsg").textContent=
   result.error.message;
   return;
  }
 }

 $("authMsg").textContent=
 "✅ Registration হয়েছে। এখন Login করুন।";

 showLogin();
}


/* =====================================================
   LOGIN
   ===================================================== */

async function login(){

 const email=$("loginEmail")
 .value.trim().toLowerCase();

 const password=$("loginPassword").value;

 if(!email||!password){
  $("authMsg").textContent=
  "Email এবং Password দিন।";
  return;
 }

 const result=
 await db.auth.signInWithPassword({
  email:email,
  password:password
 });

 if(result.error){
  $("authMsg").textContent=
  result.error.message;
  return;
 }

 currentUser=result.data.user;

 await loadProfile();
}


/* =====================================================
   LOAD PROFILE
   ===================================================== */

async function loadProfile(){

 if(!currentUser)return;

 const result=
 await db
 .from("users")
 .select("*")
 .eq("id",currentUser.id)
 .single();

 if(result.error){
  alert(result.error.message);
  return;
 }

 profile=result.data;

 renderApp();
}


/* =====================================================
   RENDER
   ===================================================== */

function renderApp(){

 $("authBox").classList.add("hidden");
 $("app").classList.remove("hidden");

 $("welcome").textContent=
 "👤 "+(profile.name||"User");

 $("balance").textContent=
 Number(profile.balance||0).toFixed(2);

 if(profile.active){

  $("accountStatus").textContent=
  "🟢 Active";

  $("accountStatus").style.background=
  "#d9f6df";

  $("activationBox").classList.add("hidden");
  $("mainMenu").classList.remove("hidden");

 }else{

  $("accountStatus").textContent=
  "🔴 Inactive";

  $("accountStatus").style.background=
  "#ffdede";

  $("activationBox").classList.remove("hidden");
  $("mainMenu").classList.add("hidden");
 }
}


/* =====================================================
   ACTIVATION
   ===================================================== */

async function sendActivation(){

 const trx=$("activationTrx")
 .value.trim();

 if(!trx){
  alert("Transaction ID দিন।");
  return;
 }

 const result=
 await db
 .from("activation_requests")
 .insert({
  user_id:currentUser.id,
  trx_id:trx,
  amount:30,
  status:"pending"
 });

 if(result.error){
  $("activationMsg").textContent=
  result.error.message;
  return;
 }

 $("activationMsg").textContent=
 "✅ Activation request Admin Panel-এ পাঠানো হয়েছে।";

 $("activationTrx").value="";
}


/* =====================================================
   DAILY JOB
   ===================================================== */

async function dailyJobs(){

 const box=$("content");

 box.innerHTML=
 "<h2>💼 Daily Job</h2><p>Loading...</p>";

 const result=
 await db
 .from("tasks")
 .select("*")
 .eq("is_open",true)
 .order("created_at",{ascending:false});

 if(result.error){
  box.innerHTML=
  "<p>"+esc(result.error.message)+"</p>";
  return;
 }

 if(!result.data.length){
  box.innerHTML=
  "<h2>💼 Daily Job</h2><p>এখন কোনো Task নেই।</p>";
  return;
 }

 box.innerHTML=
 "<h2>💼 Daily Job</h2>"+
 result.data.map(task=>`

 <div class="item">

 <b>${esc(task.title)}</b>

 <br><br>

 ${esc(task.description||"")}

 <br><br>

 💰 Reward:
 <b>৳${Number(task.reward||0).toFixed(2)}</b>

 <textarea
 id="proof_${task.id}"
 placeholder="Task proof / submission">
 </textarea>

 <button onclick="submitTask('${task.id}')">
 📤 Submit Task
 </button>

 </div>

 `).join("");
}


/* =====================================================
   TASK SUBMIT
   ===================================================== */

async function submitTask(taskId){

 const proof=$("proof_"+taskId)
 .value.trim();

 if(!proof){
  alert("Task proof দিন।");
  return;
 }

 const result=
 await db
 .from("task_submissions")
 .insert({
  task_id:taskId,
  user_id:currentUser.id,
  proof:proof,
  status:"pending"
 });

 if(result.error){
  alert(result.error.message);
  return;
 }

 alert(
 "✅ Task Admin Panel-এ পাঠানো হয়েছে।"
 );

 dailyJobs();
}


/* =====================================================
   GMAIL / INSTAGRAM
   ===================================================== */

function servicePage(type){

 const box=$("content");

 const gmail=type==="gmail";

 box.innerHTML=`

 <h2>
 ${gmail?"📧 Gmail Sell":"📷 Instagram Sell"}
 </h2>

 <p>
 ${gmail
 ?"Gmail account submission করুন।"
 :"Instagram account/username submission করুন।"
 }
 </p>

 <p class="small">
 ⚠️ Password, OTP বা recovery code দেবেন না।
 </p>

 <input
 id="serviceAccount"
 placeholder="${gmail
 ?'Gmail Address'
 :'Instagram Username'}">

 <textarea
 id="serviceProof"
 placeholder="Proof / প্রয়োজনীয় তথ্য">
 </textarea>

 <button
 class="orange"
 onclick="submitService('${type}')">

 📤 Submit Request

 </button>

 `;
}


/* =====================================================
   SERVICE SUBMIT
   ===================================================== */

async function submitService(type){

 const account=
 $("serviceAccount").value.trim();

 const proof=
 $("serviceProof").value.trim();

 if(!account){
  alert("Account/Username দিন।");
  return;
 }

 const result=
 await db
 .from("service_submissions")
 .insert({
  user_id:currentUser.id,
  service_type:type,
  account:account,
  proof:proof,
  status:"pending"
 });

 if(result.error){
  alert(result.error.message);
  return;
 }

 alert(
 "✅ Submission Admin Panel-এ পাঠানো হয়েছে।"
 );

 $("serviceAccount").value="";
 $("serviceProof").value="";
}


/* =====================================================
   TELEGRAM
   ===================================================== */

async function telegramPage(){

 const box=$("content");

 box.innerHTML=
 "<h2>📣 Join Telegram</h2><p>Loading...</p>";

 const result=
 await db
 .from("settings")
 .select("value")
 .eq("key","telegram_link")
 .maybeSingle();

 if(result.error){
  box.innerHTML=
  "<p>"+esc(result.error.message)+"</p>";
  return;
 }

 const link=result.data?.value||"";

 if(!link){
  box.innerHTML=`
  <h2>📣 Join Telegram</h2>
  <p>Admin এখনো Telegram link সেট করেনি।</p>
  `;
  return;
 }

 box.innerHTML=`

 <h2>📣 Join Telegram</h2>

 <p>
 Admin দেওয়া Telegram channel-এ Join করুন।
 </p>

 <a
 href="${esc(link)}"
 target="_blank"
 rel="noopener">

 <button>
 📣 Join Telegram
 </button>

 </a>

 `;
}


/* =====================================================
   WITHDRAW PAGE
   ===================================================== */

function withdrawPage(){

 const box=$("content");

 box.innerHTML=`

 <h2>💸 Withdraw</h2>

 <div class="notice">
 Available Balance:
 <b>৳${Number(profile.balance||0).toFixed(2)}</b>
 </div>

 <select id="withdrawMethod">

 <option value="Nagad">
 Nagad
 </option>

 <option value="bKash">
 bKash
 </option>

 </select>

 <input
 id="withdrawNumber"
 placeholder="Nagad / bKash Number">

 <input
 id="withdrawAmount"
 type="number"
 min="1"
 placeholder="Withdraw Amount">

 <button onclick="sendWithdraw()">
 💸 Withdraw Request
 </button>

 `;

}


/* =====================================================
   WITHDRAW REQUEST
   ===================================================== */

async function sendWithdraw(){

 const method=
 $("withdrawMethod").value;

 const number=
 $("withdrawNumber")
 .value.trim();

 const amount=
 Number(
  $("withdrawAmount").value
 );

 if(!number||!amount||amount<=0){
  alert("সব তথ্য দিন।");
  return;
 }

 if(amount>Number(profile.balance||0)){
  alert("Balance যথেষ্ট নেই।");
  return;
 }

 const result=
 await db
 .from("withdrawals")
 .insert({
  user_id:currentUser.id,
  method:method,
  account_number:number,
  amount:amount,
  status:"pending"
 });

 if(result.error){
  alert(result.error.message);
  return;
 }

 alert(
 "✅ Withdraw request Admin Panel-এ পাঠানো হয়েছে।"
 );

}


/* =====================================================
   MY REQUESTS
   ===================================================== */

async function requestsPage(){

 const box=$("content");

 box.innerHTML=
 "<h2>🧾 My Requests</h2><p>Loading...</p>";

 const activation=
 await db
 .from("activation_requests")
 .select("*")
 .eq("user_id",currentUser.id)
 .order("created_at",{ascending:false});

 const tasks=
 await db
 .from("task_submissions")
 .select("*,tasks(title,reward)")
 .eq("user_id",currentUser.id)
 .order("created_at",{ascending:false});

 const services=
 await db
 .from("service_submissions")
 .select("*")
 .eq("user_id",currentUser.id)
 .order("created_at",{ascending:false});

 const withdrawals=
 await db
 .from("withdrawals")
 .select("*")
 .eq("user_id",currentUser.id)
 .order("created_at",{ascending:false});

 let html="<h2>🧾 My Requests</h2>";

 let count=0;

 (activation.data||[]).forEach(x=>{

  count++;

  html+=`

  <div class="item">
  🔐 Activation<br>
  Transaction ID:
  <b>${esc(x.trx_id)}</b><br>
  Status:
  <b>${esc(x.status)}</b>
  </div>

  `;
 });


 (tasks.data||[]).forEach(x=>{

  count++;

  html+=`

  <div class="item">
  💼 Daily Job<br>
  Task:
  ${esc(x.tasks?.title)}<br>
  Reward:
  ৳${Number(x.tasks?.reward||0).toFixed(2)}<br>
  Status:
  <b>${esc(x.status)}</b>
  </div>

  `;
 });


 (services.data||[]).forEach(x=>{

  count++;

  html+=`

  <div class="item">
  ${x.service_type==="gmail"
  ?"📧 Gmail"
  :"📷 Instagram"}<br>

  Account:
  ${esc(x.account)}<br>

  Status:
  <b>${esc(x.status)}</b>

  </div>

  `;
 });


 (withdrawals.data||[]).forEach(x=>{

  count++;

  html+=`

  <div class="item">
  💸 Withdraw<br>

  Method:
  ${esc(x.method)}<br>

  Number:
  ${esc(x.account_number)}<br>

  Amount:
  ৳${Number(x.amount||0).toFixed(2)}<br>

  Status:
  <b>${esc(x.status)}</b>

  </div>

  `;
 });


 if(count===0){
  html+="<p>কোনো request নেই।</p>";
 }

 box.innerHTML=html;
}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout(){

 await db.auth.signOut();

 currentUser=null;
 profile=null;

 location.reload();
}


/* =====================================================
   AUTO SESSION
   ===================================================== */

(async function(){

 const session=
 await db.auth.getSession();

 if(session.data.session){

  currentUser=
  session.data.session.user;

  await loadProfile();
 }

})();


/* =====================================================
   AUTH STATE
   ===================================================== */

db.auth.onAuthStateChange(
 async(event,session)=>{

  if(session && !currentUser){

   currentUser=session.user;

   await loadProfile();
  }

 }
);

</script>

</body>
</html>
