<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Earn Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef8f2;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  color:#222
}

header{
  background:#087b18;
  color:white;
  text-align:center;
  padding:18px;
  font-size:25px;
  font-weight:700
}

.wrap{
  max-width:680px;
  margin:auto;
  padding:16px
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 4px 18px #0001
}

h2{
  color:#087b18;
  margin-top:0
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  margin:6px 0 10px;
  font-size:15px
}

textarea{
  min-height:80px
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  background:#087b18;
  color:white;
  margin-top:8px
}

button.red{background:#d90000}
button.orange{background:#f39a00}
button.gray{background:#666}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.balance{
  background:#087b18;
  color:white;
  border-radius:14px;
  text-align:center;
  padding:22px;
  font-size:30px;
  font-weight:700
}

.status{
  padding:5px 9px;
  border-radius:20px;
  background:#eee;
  display:inline-block
}

.item{
  background:#f5f5f5;
  padding:12px;
  border-radius:10px;
  margin:8px 0
}

.notice{
  background:#fff4c7;
  padding:12px;
  border-radius:10px
}

.small{
  color:#666;
  font-size:13px
}

.hidden{
  display:none
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<header>🔐 BD Earn Hub</header>

<div class="wrap">

<!-- AUTH -->
<div id="authBox" class="card">

  <h2 id="authTitle">👤 Registration</h2>

  <div id="registerFields">

    <input id="name" placeholder="আপনার নাম">

    <input id="phone" placeholder="মোবাইল নম্বর">

  </div>

  <input id="email" type="email" placeholder="ইমেইল">

  <input id="password" type="password" placeholder="Password">

  <button onclick="registerUser()" id="registerBtn">
    Account তৈরি করুন
  </button>

  <button class="gray" onclick="showLogin()">
    আগে Account থাকলে Login
  </button>

  <p id="authMsg" class="small"></p>

</div>


<!-- APP -->
<div id="app" class="hidden">

  <div class="card">

    <h2 id="welcome">👤 User</h2>

    <div class="balance">
      Balance<br>
      ৳<span id="balance">0.00</span>
    </div>

    <p>
      Status:
      <span id="activeStatus" class="status">
        🔴 Inactive
      </span>
    </p>

  </div>


  <!-- ACTIVATION -->
  <div id="activationBox" class="card">

    <h2>🔴 Account Activation</h2>

    <div class="notice">
      Nagad Send Money করুন <b>৳30</b>
      → <b>01865501991</b>
    </div>

    <p>Send Money করার পর Transaction ID দিন:</p>

    <input
      id="activationTrx"
      placeholder="Nagad Transaction ID"
    >

    <button onclick="submitActivation()">
      ✅ Activation Request
    </button>

    <p id="activationMsg" class="small"></p>

  </div>


  <!-- SERVICES -->
  <div id="servicesBox" class="hidden">

    <div class="card">

      <h2>📋 Services</h2>

      <div class="grid">

        <button onclick="showTasks()">
          💼 Daily Job
        </button>

        <button onclick="showService('instagram')">
          📷 Instagram Sell
        </button>

        <button onclick="showService('gmail')">
          📧 Gmail Sell
        </button>

        <button onclick="showTelegram()">
          📣 Join Telegram
        </button>

        <button onclick="showWithdraw()">
          💸 Withdraw
        </button>

        <button class="gray" onclick="loadMyRequests()">
          🧾 My Requests
        </button>

      </div>

    </div>


    <div id="content" class="card">

      <h2>📌 Select an option</h2>

      <p class="small">
        উপরের অপশন থেকে একটি নির্বাচন করুন।
      </p>

    </div>

  </div>


  <button class="red" onclick="logout()">
    Logout
  </button>

</div>

</div>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let user = null;


/* =========================
   HTML ESCAPE
========================= */

function esc(v){

  return String(v ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

}


/* =========================
   REGISTER
========================= */

async function registerUser(){

  const name =
    document.getElementById('name').value.trim();

  const phone =
    document.getElementById('phone').value.trim();

  const email =
    document.getElementById('email').value.trim().toLowerCase();

  const password =
    document.getElementById('password').value;

  const msg =
    document.getElementById('authMsg');


  if(!name || !phone || !email || !password){

    msg.textContent =
      'সব তথ্য পূরণ করুন।';

    return;
  }


  if(password.length < 6){

    msg.textContent =
      'Password কমপক্ষে ৬ অক্ষরের হতে হবে।';

    return;
  }


  msg.textContent =
    'Account তৈরি হচ্ছে...';


  /*
    প্রথমে Supabase Authentication user তৈরি হবে
  */

  const authResult =
    await sb.auth.signUp({

      email:email,

      password:password,

      options:{
        data:{
          name:name,
          phone:phone
        }
      }

    });


  if(authResult.error){

    msg.textContent =
      authResult.error.message;

    return;
  }


  /*
    Email confirmation বন্ধ থাকলে session পাওয়া যাবে।
    confirmation চালু থাকলে email confirm করতে হবে।
  */

  if(authResult.data.user){

    const authUser =
      authResult.data.user;


    /*
      users table-এ profile তৈরি
    */

    const profile =
      await sb
      .from('users')
      .upsert({

        id:authUser.id,

        name:name,

        phone:phone,

        email:email,

        balance:0,

        active:false

      });


    if(profile.error){

      msg.textContent =
        profile.error.message;

      return;
    }

  }


  if(authResult.data.session){

    msg.textContent =
      'Registration সফল।';

    await loadCurrentUser();

  }else{

    msg.textContent =
      'Registration সফল। Email confirmation প্রয়োজন হলে আপনার email confirm করুন, তারপর Login করুন।';

    showLogin();

  }

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document.getElementById(
    'authTitle'
  ).textContent =
    '🔐 User Login';


  document.getElementById(
    'registerFields'
  ).classList.add('hidden');


  document.getElementById(
    'registerBtn'
  ).textContent =
    'Login';


  document.getElementById(
    'registerBtn'
  ).onclick =
    loginUser;


  document.querySelector(
    '#authBox button.gray'
  ).textContent =
    'Registration';


  document.querySelector(
    '#authBox button.gray'
  ).onclick =
    showRegister;

}


/* =========================
   SHOW REGISTER
========================= */

function showRegister(){

  document.getElementById(
    'authTitle'
  ).textContent =
    '👤 Registration';


  document.getElementById(
    'registerFields'
  ).classList.remove('hidden');


  document.getElementById(
    'registerBtn'
  ).textContent =
    'Account তৈরি করুন';


  document.getElementById(
    'registerBtn'
  ).onclick =
    registerUser;


  document.querySelector(
    '#authBox button.gray'
  ).textContent =
    'আগে Account থাকলে Login';


  document.querySelector(
    '#authBox button.gray'
  ).onclick =
    showLogin;

}


/* =========================
   LOGIN
========================= */

async function loginUser(){

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  const msg =
    document.getElementById('authMsg');


  if(!email || !password){

    msg.textContent =
      'Email এবং Password দিন।';

    return;
  }


  msg.textContent =
    'Login হচ্ছে...';


  const result =
    await sb.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(result.error){

    msg.textContent =
      result.error.message;

    return;
  }


  await loadCurrentUser();

}


/* =========================
   LOAD CURRENT USER
========================= */

async function loadCurrentUser(){

  const sessionResult =
    await sb.auth.getSession();


  const session =
    sessionResult.data.session;


  if(!session){

    return;
  }


  const authUser =
    session.user;


  let result =
    await sb
    .from('users')
    .select('*')
    .eq('id',authUser.id)
    .maybeSingle();


  /*
    যদি profile না থাকে,
    Auth metadata থেকে profile তৈরি
  */

  if(!result.data){

    const profile =
      await sb
      .from('users')
      .insert({

        id:authUser.id,

        name:
          authUser.user_metadata?.name || 'User',

        phone:
          authUser.user_metadata?.phone || '',

        email:
          authUser.email,

        balance:0,

        active:false

      })
      .select()
      .single();


    if(profile.error){

      alert(profile.error.message);

      return;
    }


    result.data =
      profile.data;

  }


  user =
    result.data;


  renderApp();

}


/* =========================
   RENDER APP
========================= */

function renderApp(){

  document
  .getElementById('authBox')
  .classList.add('hidden');


  document
  .getElementById('app')
  .classList.remove('hidden');


  document
  .getElementById('welcome')
  .textContent =
    '👤 ' + user.name;


  document
  .getElementById('balance')
  .textContent =
    Number(user.balance || 0).toFixed(2);


  const status =
    document.getElementById(
      'activeStatus'
    );


  status.textContent =
    user.active
      ? '🟢 Active'
      : '🔴 Inactive';


  if(user.active){

    document
    .getElementById('activationBox')
    .classList.add('hidden');


    document
    .getElementById('servicesBox')
    .classList.remove('hidden');

  }else{

    document
    .getElementById('activationBox')
    .classList.remove('hidden');


    document
    .getElementById('servicesBox')
    .classList.add('hidden');

  }

}


/* =========================
   ACTIVATION
========================= */

async function submitActivation(){

  const trx =
    document
    .getElementById('activationTrx')
    .value.trim();


  if(!trx){

    alert(
      'Transaction ID দিন।'
    );

    return;
  }


  const result =
    await sb
    .from('activation_requests')
    .insert({

      user_id:user.id,

      trx_id:trx,

      amount:30,

      status:'pending'

    });


  if(result.error){

    alert(
      result.error.message
    );

    return;
  }


  document
  .getElementById('activationMsg')
  .textContent =
    'Request Admin Panel-এ পাঠানো হয়েছে।';

}


/* =========================
   TASKS
========================= */

async function showTasks(){

  const box =
    document.getElementById(
      'content'
    );


  box.innerHTML =
    '<h2>💼 Daily Job</h2><p>Loading...</p>';


  const result =
    await sb
    .from('tasks')
    .select('*')
    .eq('is_open',true)
    .order(
      'created_at',
      {ascending:false}
    );


  if(result.error){

    box.innerHTML =
      '<p>' +
      esc(result.error.message) +
      '</p>';

    return;
  }


  if(!result.data.length){

    box.innerHTML =
      '<h2>💼 Daily Job</h2><p>এখন কোনো Task নেই।</p>';

    return;
  }


  box.innerHTML =
    '<h2>💼 Daily Job</h2>' +

    result.data.map(t => `

      <div class="item">

        <b>${esc(t.title)}</b>

        <br>

        ${esc(t.description || '')}

        <br>

        Reward:
        ৳${Number(t.reward || 0).toFixed(2)}

        <textarea
          id="proof_${t.id}"
          placeholder="Task proof / submission"
        ></textarea>

        <button
          onclick="submitTask('${t.id}')"
        >
          📤 Submit Task
        </button>

      </div>

    `).join('');

}


/* =========================
   SUBMIT TASK
========================= */

async function submitTask(taskId){

  const proof =
    document
    .getElementById(
      'proof_' + taskId
    )
    .value.trim();


  if(!proof){

    alert(
      'Submission/proof দিন।'
    );

    return;
  }


  const result =
    await sb
    .from('task_submissions')
    .insert({

      task_id:taskId,

      user_id:user.id,

      proof:proof,

      status:'pending'

    });


  alert(
    result.error
      ? result.error.message
      : 'Task submission পাঠানো হয়েছে।'
  );

}


/* =========================
   SERVICE
========================= */

function showService(type){

  const box =
    document.getElementById(
      'content'
    );


  const title =
    type === 'gmail'
      ? '📧 Gmail Sell'
      : '📷 Instagram Sell';


  const placeholder =
    type === 'gmail'
      ? 'Gmail Address'
      : 'Instagram Username';


  box.innerHTML = `

    <h2>${title}</h2>

    <p>
      Account/username এবং প্রয়োজনীয় proof দিন।
      <b>কোনো password এখানে দেবেন না।</b>
    </p>

    <input
      id="svc_account"
      placeholder="${placeholder}"
    >

    <textarea
      id="svc_proof"
      placeholder="Proof / প্রয়োজনীয় তথ্য"
    ></textarea>

    <button
      class="orange"
      onclick="submitService('${type}')"
    >
      📤 Submit Request
    </button>

  `;

}


/* =========================
   SUBMIT SERVICE
========================= */

async function submitService(type){

  const account =
    document
    .getElementById(
      'svc_account'
    )
    .value.trim();


  const proof =
    document
    .getElementById(
      'svc_proof'
    )
    .value.trim();


  if(!account){

    alert(
      'Account/Username দিন।'
    );

    return;
  }


  const result =
    await sb
    .from('service_submissions')
    .insert({

      user_id:user.id,

      service_type:type,

      account:account,

      proof:proof,

      status:'pending'

    });


  alert(
    result.error
      ? result.error.message
      : 'Request Admin Panel-এ পাঠানো হয়েছে।'
  );

}


/* =========================
   TELEGRAM
========================= */

async function showTelegram(){

  const result =
    await sb
    .from('settings')
    .select('value')
    .eq(
      'key',
      'telegram_link'
    )
    .maybeSingle();


  const link =
    result.data?.value || '#';


  document
  .getElementById('content')
  .innerHTML = `

    <h2>📣 Join Telegram</h2>

    <p>
      Admin দেওয়া Telegram channel-এ join করুন।
    </p>

    <a
      href="${esc(link)}"
      target="_blank"
      rel="noopener"
    >
      <button>
        Join Telegram
      </button>
    </a>

  `;

}


/* =========================
   WITHDRAW
========================= */

function showWithdraw(){

  document
  .getElementById('content')
  .innerHTML = `

    <h2>💸 Withdraw</h2>

    <p>
      Available Balance:
      ৳${Number(user.balance || 0).toFixed(2)}
    </p>

    <select id="wd_method">

      <option>Nagad</option>

      <option>bKash</option>

    </select>

    <input
      id="wd_number"
      placeholder="Nagad/bKash Number"
    >

    <input
      id="wd_amount"
      type="number"
      min="1"
      placeholder="Amount"
    >

    <button
      onclick="submitWithdraw()"
    >
      💸 Withdraw Request
    </button>

  `;

}


/* =========================
   SUBMIT WITHDRAW
========================= */

async function submitWithdraw(){

  const method =
    document
    .getElementById('wd_method')
    .value;


  const number =
    document
    .getElementById('wd_number')
    .value.trim();


  const amount =
    Number(
      document
      .getElementById('wd_amount')
      .value
    );


  if(!number || !amount || amount <= 0){

    alert(
      'সব তথ্য দিন।'
    );

    return;
  }


  if(amount > Number(user.balance || 0)){

    alert(
      'Balance যথেষ্ট নয়।'
    );

    return;
  }


  const result =
    await sb
    .from('withdrawals')
    .insert({

      user_id:user.id,

      method:method,

      account_number:number,

      amount:amount,

      status:'pending'

    });


  alert(
    result.error
      ? result.error.message
      : 'Withdraw request পাঠানো হয়েছে।'
  );

}


/* =========================
   MY REQUESTS
========================= */

async function loadMyRequests(){

  const box =
    document.getElementById(
      'content'
    );


  const [a,t,s,w] =
    await Promise.all([

      sb
      .from('activation_requests')
      .select('*')
      .eq('user_id',user.id)
      .order(
        'created_at',
        {ascending:false}
      ),

      sb
      .from('task_submissions')
      .select('*,tasks(title)')
      .eq('user_id',user.id)
      .order(
        'created_at',
        {ascending:false}
      ),

      sb
      .from('service_submissions')
      .select('*')
      .eq('user_id',user.id)
      .order(
        'created_at',
        {ascending:false}
      ),

      sb
      .from('withdrawals')
      .select('*')
      .eq('user_id',user.id)
      .order(
        'created_at',
        {ascending:false}
      )

    ]);


  let html =
    '<h2>🧾 My Requests</h2>';


  (a.data || []).forEach(x => {

    html += `

      <div class="item">
        Activation •
        ${esc(x.trx_id)}
        •
        ${esc(x.status)}
      </div>

    `;

  });


  (t.data || []).forEach(x => {

    html += `

      <div class="item">
        Task •
        ${esc(x.tasks?.title)}
        •
        ${esc(x.status)}
      </div>

    `;

  });


  (s.data || []).forEach(x => {

    html += `

      <div class="item">
        ${esc(x.service_type)}
        •
        ${esc(x.account)}
        •
        ${esc(x.status)}
      </div>

    `;

  });


  (w.data || []).forEach(x => {

    html += `

      <div class="item">
        Withdraw •
        ${esc(x.method)}
        • ৳${Number(x.amount || 0).toFixed(2)}
        •
        ${esc(x.status)}
      </div>

    `;

  });


  box.innerHTML =
    html;

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await sb.auth.signOut();

  location.reload();

}


/* =========================
   AUTO LOGIN
========================= */

(async function(){

  const result =
    await sb.auth.getSession();


  if(result.data.session){

    await loadCurrentUser();

  }

})();

</script>

</body>
</html>
